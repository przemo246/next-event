<h2>Potwierdź swój adres e-mail</h2>

<p>Dziękujemy za rejestrację w Afisz. Kliknij poniższy link, aby aktywować konto:</p>

<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">
    Potwierdź adres e-mail
  </a>
</p>

<p>Jeśli nie rejestrowano się tym adresem, zignoruj tę wiadomość.</p>
